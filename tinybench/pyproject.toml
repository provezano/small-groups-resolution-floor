[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tinybench"
version = "1.1.0"
description = "A benchmark for finding tiny groups (2-15 points) in unlabelled data: generator, scoring at matched false-group rates, oracle ceiling, baselines, real-group tracks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.2",
    "hdbscan>=0.8.33",
]

[project.optional-dependencies]
real = ["pandas>=1.5"]
singlecell = ["pandas>=1.5", "h5py>=3.8", "anndata>=0.9", "scanpy>=1.9"]
test = ["pytest>=7"]

[project.scripts]
tinybench = "tinybench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinybench = ["data/*.npz"]
